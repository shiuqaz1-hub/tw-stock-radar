<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 模擬交易儀表板</title>
<style>
:root{--bg:#061018;--panel:#0f172a;--line:#26364b;--text:#e5eef9;--muted:#9fb2cb;--blue:#8ab4ff;--green:#4ade80;--red:#f87171;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#061018,#0d1b2a)}.container{max-width:1200px;margin:28px auto;padding:0 20px 48px}.header,.section,.card{background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:18px}.header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;margin-bottom:20px;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}.card{padding:18px 20px}.label{color:var(--blue);font-size:12px;letter-spacing:.08em}.value{font-size:clamp(22px,3vw,34px);font-weight:700;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.section{padding:16px 18px;margin-bottom:20px}.trade-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.search-wrap{position:relative}input,select,button{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0f172acc;color:var(--text);font-size:15px}button{cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.suggestions{position:absolute;left:0;right:0;top:calc(100% + 8px);display:none;z-index:5;max-height:300px;overflow:auto;background:#081019;border:1px solid var(--line);border-radius:12px}.suggestions.visible{display:block}.suggestion{text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0}.suggestion:hover{background:#1e3a5f}.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.buy{background:#22c55e2e;color:#7ce6aa}.sell{background:#ef44442e;color:#fca5a5}.warn{background:#fbbf242e;color:#fcd34d}.muted,.status{color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow:auto}th,td{text-align:left;padding:10px;border-bottom:1px solid #94a3b824;white-space:nowrap}.inline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.small{width:auto}.hint{line-height:1.8;color:var(--muted)}@media(max-width:820px){.trade-layout,.row{grid-template-columns:1fr}}
</style>
</head>
<body><main class="container">
<header class="header"><div><div class="label">SIMULATED TRADING</div><h2>AI 模擬股票儀表板</h2></div><span class="pill buy">模擬交易 · 不連接券商</span></header>
<section class="cards"><div class="card"><div class="label">台灣加權指數</div><div id="indexValue" class="value">--</div><div id="indexStatus" class="status">讀取中</div></div><div class="card"><div class="label">選定股票</div><div id="selectedStock" class="value">未選擇</div></div><div class="card"><div class="label">目前價格</div><div id="selectedPrice" class="value">--</div></div><div class="card"><div class="label">成交紀錄</div><div id="tradeCount" class="value">0 筆</div></div></section>
<div class="trade-layout"><section class="section"><div class="inline"><h3>詳細模擬下單</h3><span id="statusText" class="status">行情更新中...</span></div><div class="search-wrap"><input id="stockInput" placeholder="輸入代號或名稱，例如 00、2330、台積電" autocomplete="off"><div id="suggestions" class="suggestions"></div></div><div class="row"><label class="muted">下單價格<input id="orderPrice" type="number" step="0.1" min="0"></label><label class="muted">數量<input id="orderQty" type="number" step="100" min="1" value="1000"></label></div><div class="row"><label class="muted">交易方向<select id="orderType"><option value="buy">買進</option><option value="sell">賣出</option></select></label><label class="muted">市場<select id="orderMarket"><option value="tse">上市</option><option value="otc">上櫃</option></select></label></div><div class="row"><label class="muted">交易類別<select id="orderMode"><option value="market">市價單</option><option value="limit">委任限價單</option></select></label><label class="muted">指定下單時間<input id="orderTime" type="time"></label></div><div class="row"><button id="submitBtn" class="buy">送出模擬下單</button><button id="refreshBtn">立即更新行情</button></div></section>
<section class="section"><div class="inline"><h3>股票詳細資料</h3><span id="selectedMeta" class="pill buy">未選擇</span></div><div id="stockDetail" class="hint">輸入股票代號後，會顯示相同代號與名稱的候選股票；點選後會載入該股行情。</div></section></div>
<section class="section"><h3>委任單</h3><table><thead><tr><th>股票</th><th>方向</th><th>限價</th><th>指定時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="pendingBody"><tr><td colspan="6" class="muted">尚無委任單</td></tr></tbody></table></section>
<section class="section"><h3>成交紀錄</h3><table><thead><tr><th>時間</th><th>股票</th><th>方向</th><th>價格</th><th>數量</th><th>備註</th></tr></thead><tbody id="tradeBody"><tr><td colspan="6" class="muted">尚無成交紀錄</td></tr></tbody></table></section>
<section class="section hint">行情來源為交易所公開行情 API。盤中會依 API 回傳更新；收盤、週末或 API 延遲時顯示最近一筆成交/收盤價，不代表可直接下真實券商委託。</section>
</main>
<script>
const $=id=>document.getElementById(id), state={stocks:[],selected:null,pending:[],trades:[]};
const fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2}):'--';
const marketName=m=>m==='otc'?'上櫃':'上市';
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url);return r.json()}
function taipei(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}))}
function openMarket(){const d=taipei(),m=d.getDay()*1440+d.getHours()*60+d.getMinutes();return d.getDay()>0&&d.getDay()<6&&m>=540&&m<=810}
function updateSelected(){const s=state.selected;if(!s){$('selectedStock').textContent='未選擇';$('selectedPrice').textContent='--';$('selectedMeta').textContent='未選擇';return}const p=Number(s.price||0);$('selectedStock').textContent=`${s.code} ${s.name}`;$('selectedPrice').textContent=`NT$ ${fmt(p)}`;$('selectedMeta').textContent=`${s.market} · ${s.code}`;$('selectedMeta').className=`pill ${s.change>=0?'buy':'sell'}`;$('orderPrice').value=p||'';$('orderMarket').value=s.market==='上市'?'tse':'otc';$('stockDetail').innerHTML=`<div>股票：${s.code} ${s.name}</div><div>市場：${s.market}　成交：${fmt(p)}　漲跌：${s.change>=0?'+':''}${fmt(s.change)} (${s.changePct>=0?'+':''}${fmt(s.changePct)}%)</div><div>開盤：${fmt(s.open)}　最高：${fmt(s.high)}　最低：${fmt(s.low)}　昨收：${fmt(s.previous)}</div><div>資料時間：${s.time||'--'}　來源：${s.source||'交易所公開行情'}</div>`}
function copyQuote(q,fallback){return {code:String(q.code||fallback.code),name:String(q.name||fallback.name),market:String(q.market||fallback.market),price:Number(q.price||fallback.price||0),previous:Number(q.previous||fallback.previous||0),change:Number(q.change||fallback.change||0),changePct:Number(q.changePct||fallback.changePct||0),open:Number(q.open||fallback.open||0),high:Number(q.high||fallback.high||0),low:Number(q.low||fallback.low||0),close:Number(q.close||fallback.close||q.previous||fallback.previous||0),time:q.time||new Date().toLocaleTimeString('zh-TW'),source:q.source||'TWSE MIS'}}
async function loadStocks(){try{const d=await json('/api/market?market=all');state.stocks=Array.isArray(d.stocks)?d.stocks:[];$('statusText').textContent=`行情已更新（${state.stocks.length} 檔）`;syncFromList()}catch(e){$('statusText').textContent='行情 API 暫時無法連線'}}
function syncFromList(){if(!state.selected)return;const x=state.stocks.find(v=>String(v.code)===state.selected.code&&String(v.market)===state.selected.market);if(x){state.selected=copyQuote(x,x);updateSelected()}}
function suggestions(v){const key=String(v||'').trim().toLowerCase();if(!key){$('suggestions').classList.remove('visible');return}const a=state.stocks.filter(x=>String(x.code).includes(key)||String(x.name||'').toLowerCase().includes(key)).slice(0,15);$('suggestions').innerHTML=a.length?a.map(x=>`<button class="suggestion" data-code="${x.code}" data-market="${x.market==='上市'?'tse':'otc'}">${x.code}　${x.name}　${x.market}　市價 ${fmt(x.price)}</button>`).join(''):'<div class="suggestion muted">找不到相符股票，請確認行情清單已載入</div>';$('suggestions').classList.add('visible')}
async function select(code,market){const fallback=state.stocks.find(x=>String(x.code)===String(code)&&String(x.market)===marketName(market));try{const q=await json(`/api/quote?code=${encodeURIComponent(code)}&market=${market}&_=${Date.now()}`);state.selected=copyQuote(q,fallback||{code,name:'',market:marketName(market)});}catch(e){if(!fallback){$('statusText').textContent='查無此股票';return}state.selected=copyQuote(fallback,fallback)}$('stockInput').value=`${state.selected.code} ${state.selected.name}`;$('suggestions').classList.remove('visible');updateSelected();$('statusText').textContent=`${state.selected.code} 最新價格 ${fmt(state.selected.price)}`}
async function refreshIndex(){try{const q=await json(`/api/quote?code=0050&market=tse&_=${Date.now()}`);const p=Number(q.price||0),c=Number(q.change||0);$('indexValue').textContent=fmt(p);$('indexValue').className=`value ${c>=0?'green':'red'}`;$('indexStatus').textContent=`${c>=0?'+':''}${fmt(c)} (${q.changePct>=0?'+':''}${fmt(q.changePct)}%) · ${q.time||''}`}catch(e){$('indexValue').textContent='--';$('indexStatus').textContent='加權指數 API 暫時無資料'}}
function renderPending(){ $('pendingBody').innerHTML=state.pending.length?state.pending.map(o=>`<tr><td>${o.code} ${o.name}</td><td>${o.type==='buy'?'買進':'賣出'}</td><td>${fmt(o.price)}</td><td>${o.time||'當日'}</td><td>${o.text}</td><td><button class="small" data-cancel="${o.id}">取消</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">尚無委任單</td></tr>'}
function renderTrades(){$('tradeCount').textContent=`${state.trades.length} 筆`;$('tradeBody').innerHTML=state.trades.length?state.trades.slice(0,20).map(t=>`<tr><td>${t.at}</td><td>${t.code}</td><td>${t.type==='buy'?'買進':'賣出'}</td><td>${fmt(t.price)}</td><td>${fmt(t.qty)}</td><td>${t.note}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">尚無成交紀錄</td></tr>'}
function processOrders(){const now=taipei(),mins=now.getHours()*60+now.getMinutes();if(!openMarket()){state.pending.forEach(o=>o.text='收盤自動取消');state.pending=[];renderPending();return}state.pending=state.pending.filter(o=>{const s=state.selected&&state.selected.code===o.code?state.selected:null;if(!s){o.text='等待行情';return true}const hit=o.type==='buy'?s.price<=o.price:s.price>=o.price;if(hit){state.trades.unshift({at:new Date().toLocaleString('zh-TW',{hour12:false}),code:o.code,type:o.type,price:o.price,qty:o.qty,note:'委任單成交'});return false}if(o.time){const [h,m]=o.time.split(':').map(Number);if(mins>=h*60+m){o.text='指定時間未觸發';return false}}o.text=`等待成交（現價 ${fmt(s.price)}）`;return true});renderPending();renderTrades()}
$('stockInput').addEventListener('input',e=>suggestions(e.target.value));$('suggestions').addEventListener('click',e=>{const b=e.target.closest('[data-code]');if(b)select(b.dataset.code,b.dataset.market)});$('stockInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const x=state.stocks.find(x=>x.code===e.target.value.trim()||x.name===e.target.value.trim());if(x)select(x.code,x.market==='上市'?'tse':'otc')}});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('suggestions').classList.remove('visible')});
$('submitBtn').addEventListener('click',()=>{if(!state.selected)return alert('請先選擇股票');const type=$('orderType').value,mode=$('orderMode').value,price=Number($('orderPrice').value),qty=Number($('orderQty').value);if(!price||!qty)return alert('請輸入有效價格與數量');if(mode==='market'){state.trades.unshift({at:new Date().toLocaleString('zh-TW',{hour12:false}),code:state.selected.code,type,price:state.selected.price,qty,note:'市價單模擬成交'});renderTrades();return}state.pending.push({id:Date.now(),code:state.selected.code,name:state.selected.name,type,price,qty,time:$('orderTime').value,text:'等待成交'});renderPending()});$('pendingBody').addEventListener('click',e=>{const id=e.target.dataset.cancel;if(id){state.pending=state.pending.filter(x=>String(x.id)!==id);renderPending()}});$('refreshBtn').addEventListener('click',async()=>{await loadStocks();await refreshIndex();processOrders()});
(async()=>{await loadStocks();await refreshIndex();$('orderTime').value='09:30';setInterval(async()=>{await loadStocks();await refreshIndex();processOrders()},5000)})();
</script></body></html>
