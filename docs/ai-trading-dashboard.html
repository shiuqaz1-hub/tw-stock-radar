<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>股市大富翁｜AI 台股雷達</title>
<style>
:root{--bg:#061018;--panel:#142331;--panel2:#0c1b27;--line:#2b4052;--text:#edf3f7;--muted:#9baec0;--red:#ff665a;--green:#39d49c;--gold:#e8d19c;--blue:#8bb5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.app{max-width:1080px;margin:auto;padding:18px 14px 96px}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 20px}.mark{width:44px;height:44px;border:2px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font-weight:800}.brand small,.muted,.meta{color:var(--muted)}.brand h1{font-size:22px;margin:2px 0}.page{display:none}.page.active{display:block}.page h2{font-size:28px;margin:8px 0 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.card h3{margin:0 0 12px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}.tabs button.active,button.primary{background:var(--blue);color:#071018;border-color:var(--blue);font-weight:700}.rank-list{display:grid;gap:10px}.rank{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;cursor:pointer}.rank:hover{border-color:var(--blue)}.num{width:30px;color:var(--gold);font-size:21px;font-weight:800;text-align:center}.rank-main{flex:1;min-width:0}.rank-main b{font-size:17px}.meta{display:block;font-size:12px;margin-top:5px}.reason{display:block;font-size:13px;line-height:1.5;margin-top:7px}.recommend{color:var(--gold)}.not-recommend{color:var(--muted)}.quote{text-align:right;font-weight:800;font-size:17px;white-space:nowrap}.change{display:block;font-size:13px;margin-top:4px}.up{color:var(--red)}.down{color:var(--green)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.label{display:block;color:var(--muted);font-size:13px}.input,select{width:100%;margin:6px 0 12px;padding:12px;border-radius:11px;border:1px solid var(--line);background:#091923;color:var(--text);font-size:15px}.accounts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.account{padding:12px;text-align:left}.account.selected{border-color:var(--gold)}.holding{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.holding:last-child{border-bottom:0}.comment{border-left:3px solid var(--gold);background:var(--panel2);border-radius:10px;padding:12px;margin:10px 0}.strategy{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.strategy button{padding:7px 9px;font-size:12px}.strategy button.active{background:var(--gold);color:#101b22}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.summary b{display:block;font-size:21px;margin-top:6px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;background:#08151e;border-top:1px solid var(--line)}.bottom button{flex:1;max-width:220px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:12px;padding:11px 3px}.bottom button.active{color:var(--red)}.empty{text-align:center;padding:28px;color:var(--muted)}.toast{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#223747;border:1px solid var(--line);padding:10px 15px;border-radius:10px}.toast.show{display:block}@media(max-width:680px){.form-grid{grid-template-columns:1fr}.accounts{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}.rank{padding:11px}.page h2{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <header class="brand"><div class="mark">許</div><div><small>許家模擬股票</small><h1>AI 台股雷達</h1></div></header>
  <main>
    <section id="radar" class="page active">
      <h2>AI 帳戶推薦</h2>
      <div class="card"><h3>帳戶 4、帳戶 5 推薦股票與原因</h3><div class="tabs" id="aiTabs"><button class="active" data-ai="4">帳戶 4・AI 當沖</button><button data-ai="5">帳戶 5・AI 波段</button></div><p class="muted">推薦會依最新行情、漲幅與成交量更新；不推薦時會明確顯示原因。</p><div id="rankingList" class="rank-list"></div></div>
    </section>
    <section id="orders" class="page">
      <h2>下單</h2>
      <div class="card"><h3>模擬委任下單</h3><p class="muted">可輸入股票代號、名稱或 AI 排名 1～50。帳戶 4、5 僅供查看。</p><div id="accountPicker" class="accounts"></div></div>
      <div class="card"><div class="form-grid"><label class="label">股票代號／名稱／排名<input id="orderCode" class="input" value="2330" placeholder="2330、台積電、排名 1"></label><label class="label">交易方向<select id="orderSide"><option value="BUY">買進</option><option value="SELL">賣出</option></select></label><label class="label">價格<input id="orderPrice" class="input" type="number" min="0" step="0.1"></label><label class="label">數量<input id="orderQty" class="input" type="number" min="1" value="1000"></label><label class="label">交易類別<select id="orderMode"><option value="LIMIT">限價委任</option><option value="MARKET">市價模擬成交</option></select></label><label class="label">指定時間<input id="orderTime" class="input" type="time"></label></div><p id="orderHint" class="muted"></p><button id="submitOrder" class="primary">送出模擬下單</button></div>
      <div class="card"><h3>委任單</h3><div id="pendingOrders" class="empty">尚無委任單</div></div>
    </section>
    <section id="inventory" class="page">
      <h2>股票與持有庫存</h2><div class="card"><div id="inventoryTabs" class="tabs"></div><h3 id="inventoryAccount">帳戶 1・主控</h3><div class="holding"><span>資產淨值</span><b id="equity">$5,000,000</b></div><div class="holding"><span>可用餘額</span><b id="cashInventory">$5,000,000</b></div></div><div id="holdings" class="card empty">目前沒有持股</div><div class="card"><h3>帳戶 4、5 AI 評論</h3><div id="accountComments"></div></div><div class="card"><h3>成交紀錄</h3><div id="tradeHistory" class="empty">尚無模擬成交紀錄</div></div>
    </section>
    <section id="ranking" class="page"><h2>富翁榜</h2><div class="card"><h3>模擬資產排名</h3><div id="wealthList"></div></div></section>
    <section id="market" class="page">
      <h2>台股資訊</h2><div class="card"><h3>市場總覽</h3><div id="marketSummary" class="summary"></div></div><div class="card"><div class="tabs" id="marketTabs"><button class="active" data-market="全部">全部</button><button data-market="上市">上市</button><button data-market="上櫃">上櫃</button></div><input id="search" class="input" placeholder="搜尋股票代號或名稱"><div id="stockList" class="rank-list"></div></div>
    </section>
  </main>
</div>
<nav class="bottom"><button class="active" data-page="radar">◉<br>AI推薦</button><button data-page="orders">◫<br>下單</button><button data-page="inventory">▣<br>股票</button><button data-page="ranking">🏆<br>富翁榜</button><button data-page="market">☷<br>台股資訊</button></nav><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW'),fmt=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2}),num=v=>{const n=Number(String(v??'').replace(/[,%\s]/g,''));return Number.isFinite(n)?n:0};
const names={1:'帳戶 1・主控',2:'帳戶 2・主控',3:'帳戶 3・主控',4:'帳戶 4・AI 當沖',5:'帳戶 5・AI 波段'},accounts={};for(let i=1;i<=5;i++)accounts[i]={name:names[i],cash:5000000,holdings:{},trades:[],pending:[]};accounts[4].holdings={'2330':{qty:1000,avg:728}};accounts[5].holdings={'2454':{qty:1500,avg:1095}};
let active=1,ai=4,stocks=[],ranking=[],marketFilter='全部';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='inventory')renderInventory();if(id==='ranking')renderWealth()}
function stock(code){return stocks.find(s=>String(s.code)===String(code))}
function why(s,type){const p=num(s?.changePct),v=num(s?.volume);if(type===4&&p>0&&v>500000)return `短線漲幅 ${fmt(p)}%，成交量 ${Math.round(v).toLocaleString()} 張放大，量價配合，適合觀察當沖。`;if(type===5&&p>.8&&v>300000)return `漲幅 ${fmt(p)}%、成交量 ${Math.round(v).toLocaleString()} 張，波段趨勢偏強，可分批觀察。`;return type===4?'漲幅或成交量未確認，當沖不推薦，等待突破或回檔。':'波段趨勢尚未明確，量價未同步，不推薦追價，等待更多資訊。'}
function build(){ranking=stocks.map(s=>{const p=num(s.changePct),v=num(s.volume),ok=ai===4?p>0&&v>500000:p>.8&&v>300000;return {...s,score:p*8+Math.log10(Math.max(v,1))*2,ok}}).sort((a,b)=>b.score-a.score).slice(0,50);renderRanking()}
function renderRanking(){$('rankingList').innerHTML=ranking.map((s,i)=>`<div class="rank" data-code="${s.code}"><span class="num">${i+1}</span><span class="rank-main"><b>${s.name||'--'} ${s.code}</b><span class="meta">${s.market||'上市'}・成交量 ${Math.round(num(s.volume)).toLocaleString()} 張</span><span class="reason ${s.ok?'recommend':'not-recommend'}">${s.ok?'推薦買進':'不推薦'}：${why(s,ai)}</span></span><span class="quote">${fmt(s.price)}<span class="change ${num(s.changePct)>=0?'up':'down'}">${num(s.changePct)>=0?'+':''}${fmt(s.changePct)}%</span></span></div>`).join('')||'<div class="empty">目前沒有排名資料</div>'}
function renderMarket(){let list=stocks.filter(s=>marketFilter==='全部'||s.market===marketFilter),q=($('search').value||'').trim().toLowerCase();if(q)list=list.filter(s=>(s.code+' '+s.name).toLowerCase().includes(q));$('stockList').innerHTML=list.slice(0,100).map((s,i)=>`<div class="rank" data-code="${s.code}"><span class="num">${i+1}</span><span class="rank-main"><b>${s.name} ${s.code}</b><span class="meta">${s.market}・成交量 ${Math.round(num(s.volume)).toLocaleString()} 張</span></span><span class="quote">${fmt(s.price)}<span class="change ${num(s.changePct)>=0?'up':'down'}">${num(s.changePct)>=0?'+':''}${fmt(s.changePct)}%</span></span></div>`).join('')||'<div class="empty">找不到股票</div>'}
function renderAccounts(){$('accountPicker').innerHTML=[1,2,3,4,5].map(i=>`<button class="account ${active===i?'selected':''}" data-account="${i}"><b>${names[i]}</b><br><small>${i>3?'AI 唯讀':'可手動操作'}</small></button>`).join('');document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{active=+b.dataset.account;renderAccounts();updateAccount()})}
function updateAccount(){const a=accounts[active];$('inventoryAccount').textContent=a.name;$('cashInventory').textContent=money(a.cash);$('cashTop')?.remove();const value=Object.entries(a.holdings).reduce((x,[c,h])=>x+(stock(c)?.price||h.avg)*h.qty,0);$('equity').textContent=money(a.cash+value);renderInventory();renderPending()}
function renderInventory(){const a=accounts[active],keys=Object.keys(a.holdings);$('holdings').className='card '+(keys.length?'':'empty');$('holdings').innerHTML=keys.length?keys.map(c=>{const h=a.holdings[c],s=stock(c)||{name:c,price:h.avg},p=(num(s.price)-h.avg)*h.qty;return `<div class="holding"><span><b>${s.name} ${c}</b><small class="meta">持有 ${h.qty.toLocaleString()} 股・成本 ${fmt(h.avg)}・現價 ${fmt(s.price)}</small></span><b class="${p>=0?'up':'down'}">${p>=0?'+':''}${money(p)}</b></div>`}).join(''):'目前沒有持股';$('tradeHistory').innerHTML=a.trades.length?a.trades.slice().reverse().map(t=>`<div class="holding"><span>${t.side==='BUY'?'買進':'賣出'} ${t.code}<small class="meta">${t.qty} 股・${t.note||''}</small></span><b>${fmt(t.price)}</b></div>`).join(''):'<div class="empty">尚無模擬成交紀錄</div>';$('accountComments').innerHTML=[4,5].map(i=>{const a2=accounts[i],items=Object.entries(a2.holdings).map(([c,h])=>`<div class="comment"><b>${names[i]}・${c}</b><br><span class="muted">持有 ${h.qty.toLocaleString()} 股。</span><br>${why(stock(c)||{},i)}<div class="strategy"><button class="active">持續持有</button><button>分批減碼</button><button>大量賣出</button></div></div>`).join('');return items||`<div class="comment"><b>${names[i]}</b><br>目前空手，等待 AI 訊號。</div>`}).join('');document.querySelectorAll('.strategy button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function renderPending(){const a=accounts[active];$('pendingOrders').innerHTML=a.pending.length?a.pending.map(o=>`<div class="holding"><span>${o.code}・${o.side==='BUY'?'買進':'賣出'} ${o.qty} 股<small class="meta">限價 ${fmt(o.price)}・${o.time||'盤中有效'}・${o.status}</small></span><button data-cancel="${o.id}">取消</button></div>`).join(''):'<div class="empty">尚無委任單</div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{a.pending=a.pending.filter(x=>x.id!=b.dataset.cancel);renderPending()})}
function resolve(v){const x=String(v||'').trim(),m=x.match(/(?:排名|rank|#)?\s*(\d+)/i);if(m&&+m[1]>=1&&+m[1]<=50&&ranking[+m[1]-1])return ranking[+m[1]-1].code;return stock(x)?.code||x.toUpperCase()}
function hint(){const s=stock(resolve($('orderCode').value));$('orderHint').textContent=s?`${s.name} ${s.code}・現價 ${fmt(s.price)}・${why(s,ai)}`:'請輸入有效股票代號、名稱或排名 1～50。';if(s)$('orderPrice').value=s.price}
function submit(){if(active>3)return toast('帳戶 4、5 僅供查看，不能手動下單');const c=resolve($('orderCode').value),s=stock(c),side=$('orderSide').value,q=num($('orderQty').value),p=num($('orderPrice').value),a=accounts[active];if(!s||!q||!p)return toast('請輸入有效股票、價格與數量');if($('orderMode').value==='MARKET'){if(side==='SELL'&&(!a.holdings[c]||a.holdings[c].qty<q))return toast('持股數量不足');a.trades.push({side,code:c,qty:q,price:s.price,note:'市價模擬成交'});if(side==='BUY'){a.cash-=s.price*q;const h=a.holdings[c]||{qty:0,avg:s.price};h.avg=(h.avg*h.qty+s.price*q)/(h.qty+q);h.qty+=q;a.holdings[c]=h}else{a.holdings[c].qty-=q;a.cash+=s.price*q;if(!a.holdings[c].qty)delete a.holdings[c]}updateAccount();return toast('市價模擬成交')}a.pending.push({id:Date.now(),code:c,side,qty:q,price:p,time:$('orderTime').value,status:'等待成交'});renderPending();toast('限價委任已建立')}
function process(){const d=new Date(),mins=d.getHours()*60+d.getMinutes(),open=d.getDay()>0&&d.getDay()<6&&mins>=540&&mins<=810;Object.values(accounts).forEach(a=>a.pending=a.pending.filter(o=>{const s=stock(o.code);if(!open)return false;if(!s)return true;const hit=o.side==='BUY'?s.price<=o.price:s.price>=o.price;if(!hit)return true;a.trades.push({side:o.side,code:o.code,qty:o.qty,price:s.price,note:'限價委任成交'});if(o.side==='BUY'){a.cash-=s.price*o.qty;const h=a.holdings[o.code]||{qty:0,avg:s.price};h.avg=(h.avg*h.qty+s.price*o.qty)/(h.qty+o.qty);h.qty+=o.qty;a.holdings[o.code]=h}else if(a.holdings[o.code]&&a.holdings[o.code].qty>=o.qty){a.holdings[o.code].qty-=o.qty;a.cash+=s.price*o.qty;if(!a.holdings[o.code].qty)delete a.holdings[o.code]}return false}));renderPending();updateAccount()}
function renderWealth(){$('wealthList').innerHTML=[1,2,3,4,5].map(i=>`<div class="holding"><span>${names[i]}</span><b>${money(accounts[i].cash)}</b></div>`).join('')}
function renderSummary(){const up=stocks.filter(s=>num(s.changePct)>0),down=stocks.filter(s=>num(s.changePct)<0),vol=stocks.reduce((x,s)=>x+num(s.volume),0);$('marketSummary').innerHTML=`<div>上漲<b class="up">${up.length}</b></div><div>下跌<b class="down">${down.length}</b></div><div>總成交量<b>${Math.round(vol).toLocaleString()}</b></div><div>股票檔數<b>${stocks.length}</b></div>`}
async function load(){try{const d=await (await fetch('/api/market?market=all&_='+Date.now())).json();stocks=(d.stocks||[]).filter(s=>num(s.price)>0)}catch(e){stocks=[{code:'2330',name:'台積電',market:'上市',price:728,changePct:1.8,volume:2370000},{code:'2454',name:'聯發科',market:'上市',price:1095,changePct:-.2,volume:1810000},{code:'2317',name:'鴻海',market:'上市',price:99.3,changePct:.7,volume:1490000},{code:'0050',name:'元大台灣50',market:'上市',price:97.2,changePct:.9,volume:1200000}]}build();renderMarket();renderSummary();updateAccount()}
function renderMarket(){renderMarketList()}
function renderMarketList(){let x=stocks.filter(s=>marketFilter==='全部'||s.market===marketFilter),q=($('search').value||'').toLowerCase();if(q)x=x.filter(s=>(s.code+' '+s.name).toLowerCase().includes(q));$('stockList').innerHTML=x.slice(0,100).map((s,i)=>`<div class="rank" data-code="${s.code}"><span class="num">${i+1}</span><span class="rank-main"><b>${s.name} ${s.code}</b><span class="meta">${s.market}・成交量 ${Math.round(num(s.volume)).toLocaleString()} 張</span></span><span class="quote">${fmt(s.price)}<span class="change ${num(s.changePct)>=0?'up':'down'}">${num(s.changePct)>=0?'+':''}${fmt(s.changePct)}%</span></span></div>`).join('')||'<div class="empty">找不到股票</div>'}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>page(b.dataset.page));document.querySelectorAll('#aiTabs button').forEach(b=>b.onclick=()=>{ai=+b.dataset.ai;document.querySelectorAll('#aiTabs button').forEach(x=>x.classList.toggle('active',x===b));build()});document.querySelectorAll('#marketTabs button').forEach(b=>b.onclick=()=>{marketFilter=b.dataset.market;document.querySelectorAll('#marketTabs button').forEach(x=>x.classList.toggle('active',x===b));renderMarketList()});$('search').oninput=renderMarketList;$('orderCode').oninput=hint;$('submitOrder').onclick=submit;$('rankingList').onclick=e=>{const x=e.target.closest('[data-code]');if(x){page('orders');$('orderCode').value=x.dataset.code;hint()}};$('stockList').onclick=e=>{const x=e.target.closest('[data-code]');if(x){page('orders');$('orderCode').value=x.dataset.code;hint()}};
(async()=>{await load();renderAccounts();$('inventoryTabs').innerHTML=[1,2,3,4,5].map(i=>`<button data-inv="${i}">${i}</button>`).join('');document.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{active=+b.dataset.inv;updateAccount()});$('orderTime').value='09:30';hint();setInterval(async()=>{await load();process()},15000)})();
</script>
</body>
</html>
