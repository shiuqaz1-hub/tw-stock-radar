<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 模擬交易執行版</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #061018, #0b1420 100%);
      color: #e5eef9;
      font-family: "Segoe UI", sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 18px 48px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 24px;
    }
    h2 { margin: 0; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(59, 130, 246, 0.24);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .label { color: #8ab4ff; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .value {
      margin-top: 10px;
      font-size: 30px;
      font-weight: bold;
    }
    .green { color: #4ade80; }
    .red { color: #f87171; }
    .subtle { color: #a8b7d1; font-size: 12px; margin-top: 10px; }
    .section {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 22px;
    }
    .status {
      font-size: 14px;
      color: #c3d9ff;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    th { color: #b5c9ec; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
    }
    .buy { background: rgba(34, 197, 94, 0.18); color: #7ce6aa; }
    .sell { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
    button {
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div style="font-size: 12px; color: #8ab4ff; letter-spacing: 0.08em;">SIMULATED ALGO TRADING</div>
        <h2>AI 模擬股票執行版</h2>
      </div>
      <button id="runBtn">重新模擬</button>
    </div>

    <div id="summaryCards" class="cards"></div>

    <div class="section">
      <div id="statusText" class="status">模擬結果：載入中…</div>
      <table>
        <thead>
          <tr>
            <th>帳戶</th>
            <th>股票</th>
            <th>方向</th>
            <th>價格</th>
            <th>數量</th>
            <th>時間</th>
            <th>AI 判斷理由</th>
          </tr>
        </thead>
        <tbody id="tradeBody"></tbody>
      </table>
    </div>
  </div>

  <script src="./simulate.js"></script>
</body>
</html>
