<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>股市大富翁</title>
<style>
:root{--bg:#050b12;--panel:#182331;--panel2:#0c131c;--line:#2a3948;--text:#edf3f7;--muted:#8998aa;--red:#ff5d4d;--green:#36c77b;--gold:#e8d4a3}*{box-sizing:border-box}body{margin:0;background:#02070d;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(#071019,#09131d);padding-bottom:78px}.status,.top,.site,.section{padding-left:16px;padding-right:16px}.status{height:44px;padding-top:12px;display:flex;justify-content:space-between;font-weight:700}.top{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #172330}.menu{font-size:22px}.top h1{font-size:20px;margin:0}.site{padding-top:14px;padding-bottom:10px;color:var(--muted);font-size:13px}.head{margin:0 16px;padding:14px 12px;background:#121b24;border:1px solid var(--line);border-radius:18px}.headrow,.index,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#202c38;border:2px solid #a84348;color:var(--red);font-weight:900}.muted{color:var(--muted)}.tag{color:var(--red);background:#43171e;padding:5px 8px;border-radius:7px;font-size:12px}.pill{border:1px solid #344453;background:#202d3a;border-radius:24px;padding:10px 12px}.index{margin-top:14px}.index strong{color:var(--red);font-size:20px}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.mini div{padding:9px 4px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#0d151e;font-size:11px;color:var(--muted)}.mini b{display:block;color:var(--text);font-size:12px;margin-top:4px}.red{color:var(--red)!important}.green{color:var(--green)!important}.gold{color:var(--gold)!important}.section{padding-top:20px}.section h2{font-size:21px;margin:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tabs button{height:40px;border:1px solid var(--line);border-radius:24px;background:#1b2734;color:var(--muted);font-weight:700}.tabs button.active{color:var(--text);border-color:var(--red);background:#401a20}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:28px;background:#1b2734;color:var(--text);font-size:15px;margin:3px 0 12px}.stock-list{display:grid;gap:9px}.stock{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid #263443;border-radius:20px;padding:13px 11px}.rank{color:var(--muted);text-align:center}.name{font-weight:800;font-size:16px}.sub{color:var(--muted);font-size:13px;margin-left:5px}.meta{color:var(--muted);font-size:12px;margin-top:4px}.quote{text-align:right;font-weight:800;font-size:17px}.change{display:block;font-size:13px;margin-top:4px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:flex;background:#0b1119;border-top:1px solid var(--line);z-index:3}.bottom button{flex:1;padding:11px 2px;background:none;border:0;color:var(--muted);font-size:12px}.bottom button.active{color:var(--red)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#263545;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:none;z-index:5}.toast.show{display:block}
</style>
</head>
<body><div class="app">
<div class="status"><span>22:39　◔ ◍ ◉</span><span>4G+　▮▮▮ 67</span></div>
<div class="top"><span class="menu">☰</span><h1>股市大富翁</h1><span style="margin-left:auto">×</span></div>
<div class="site">●　台股休市・AI 仍可預約下一盤，開盤後自動撮合</div>
<div class="head"><div class="headrow"><div class="brand"><div class="mark">許</div><div><div class="muted" style="font-size:12px">許家模擬股票</div><b>股市大富翁</b></div></div><button class="pill" data-action="操盤功能">操盤 #1 玩家</button></div><div class="row muted" style="margin-top:13px;font-size:13px"><span>● 已收盤</span><b>22:39:57</b></div><div class="index"><span class="muted">加權指數<br><strong>47,180.75</strong></span><b class="red">+1.93%</b></div><div class="mini"><div>可用資金<b>$5,000,000</b></div><div>上漲<b class="red">62</b></div><div>下跌<b class="green">29</b></div><div>AI 評估<b class="gold">中性</b></div></div></div>
<section class="section"><h2>台股即時排行</h2><div class="tabs" id="marketTabs"><button class="active" data-market="全部">全部</button><button data-market="上市">上市</button><button data-market="上櫃">上櫃</button></div><div class="tabs" id="sortTabs"><button class="active" data-sort="change">漲幅排行</button><button data-sort="fall">跌幅排行</button><button data-sort="volume">成交量</button></div><input id="search" class="search" placeholder="搜尋代碼或名稱"><div id="stockList" class="stock-list"></div></section>
<nav class="bottom"><button class="active" data-action="雷達">◉<br>雷達</button><button data-action="下單">◫<br>下單</button><button data-action="庫存">▣<br>庫存</button><button data-action="富翁榜">🏆<br>富翁榜</button><button data-action="排行">▤<br>排行</button></nav><div id="toast" class="toast"></div></div>
<script>
const stocks=[
{name:'京元電子',code:'2449',market:'上市',industry:'半導體',price:291.5,change:10,volume:61178},
{name:'宏致',code:'3605',market:'上市',industry:'電子零組件',price:154,change:10,volume:37969},
{name:'世紀*',code:'5314',market:'上櫃',industry:'其他',price:30.5,change:9.91,volume:123120},
{name:'宏齊',code:'6168',market:'上市',industry:'光電',price:38.85,change:9.9,volume:32720},
{name:'矽格',code:'6257',market:'上市',industry:'半導體',price:244.5,change:9.89,volume:36728},
{name:'欣銓',code:'3264',market:'上櫃',industry:'半導體',price:268.5,change:9.82,volume:28853},
{name:'聯電',code:'2303',market:'上市',industry:'半導體',price:156,change:5.76,volume:300960},
{name:'華邦電',code:'2344',market:'上市',industry:'半導體',price:179.5,change:5.59,volume:138585},
{name:'合晶',code:'6182',market:'上櫃',industry:'半導體',price:116,change:4.98,volume:64336},
{name:'聯發科',code:'2454',market:'上市',industry:'半導體',price:4710,change:4.67,volume:8991},
{name:'和益',code:'1709',market:'上市',industry:'化學',price:39.2,change:-8.73,volume:48188},
{name:'中信金',code:'2891',market:'上市',industry:'金融',price:69.5,change:-2.39,volume:74372},
{name:'玉山金',code:'2884',market:'上市',industry:'金融',price:46.4,change:-1.9,volume:91401}
];
let market='全部', sort='change';
const list=document.getElementById('stockList'), search=document.getElementById('search');
function render(){const q=search.value.trim().toLowerCase();let items=stocks.filter(s=>(market==='全部'||s.market===market)&&(!q||(s.name+s.code).toLowerCase().includes(q)));items.sort((a,b)=>sort==='volume'?b.volume-a.volume:sort==='fall'?a.change-b.change:b.change-a.change);list.innerHTML=items.map((s,i)=>`<button class="stock" data-stock="${s.code}"><span class="rank">${i+1}</span><span><span class="name">${s.name}</span><span class="sub">${s.code}</span><span class="meta">${s.market} ・ ${s.industry} ・ ${s.volume.toLocaleString()} 張</span></span><span class="quote">${s.price.toLocaleString()}<span class="change ${s.change>=0?'red':'green'}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</span></span></button>`).join('')||'<div class="muted" style="text-align:center;padding:30px">找不到符合的股票</div>';document.querySelectorAll('[data-stock]').forEach(x=>x.onclick=()=>showToast(`已選擇 ${x.dataset.stock}，登入功能完成後可進入下單`))}
function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelectorAll('#marketTabs button').forEach(b=>b.onclick=()=>{market=b.dataset.market;document.querySelectorAll('#marketTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelectorAll('#sortTabs button').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('#sortTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});search.oninput=render;document.querySelectorAll('.bottom button,.pill').forEach(b=>b.onclick=()=>showToast(`${b.dataset.action||'操盤'} 功能目前為展示模式，登入與下單權限稍後加入`));render();
</script></body></html>
