<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>股市大富翁</title>
    <style>
      :root {
        --bg: #050b12;
        --bg-2: #0b1320;
        --panel: rgba(18, 25, 35, 0.96);
        --panel-2: rgba(24, 34, 45, 0.9);
        --panel-3: rgba(13, 18, 28, 0.9);
        --line: rgba(160, 176, 197, 0.18);
        --text: #edf3f7;
        --muted: rgba(193, 207, 222, 0.7);
        --soft: rgba(255,255,255,0.08);
        --red: #ff5d4d;
        --red-soft: rgba(255, 93, 77, 0.12);
        --green: #34d399;
        --green-soft: rgba(52, 211, 153, 0.12);
        --orange: #ffb36b;
        --gold: #e8d4a3;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        background: #02070d;
      }

      .app {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: linear-gradient(180deg, #071019 0%, #09131d 100%);
        border-left: 1px solid rgba(255,255,255,0.04);
        border-right: 1px solid rgba(255,255,255,0.04);
        position: relative;
        padding-bottom: 82px;
      }

      .statusbar {
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 0 16px;
        color: var(--text);
        font-weight: 700;
        font-size: 15px;
      }

      .statusbar .left,
      .statusbar .right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .signal, .tiny {
        opacity: 0.9;
      }

      .signal-bars {
        display: flex;
        align-items: end;
        gap: 2px;
        height: 14px;
      }

      .signal-bars span {
        display: block;
        width: 2px;
        background: #f4f6fb;
        border-radius: 2px;
      }

      .signal-bars span:nth-child(1){height:4px;}
      .signal-bars span:nth-child(2){height:7px;}
      .signal-bars span:nth-child(3){height:10px;}
      .signal-bars span:nth-child(4){height:12px;}

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 10px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }

      .menu {
        width: 22px;
        height: 20px;
        position: relative;
      }

      .menu::before,
      .menu::after,
      .menu span {
        content: "";
        position: absolute;
        left: 0;
        width: 18px;
        height: 2px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .menu::before { top: 3px; }
      .menu::after { bottom: 3px; }
      .menu span { top: 9px; }

      .title-box {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        margin-left: 8px;
      }

      .title-box strong {
        font-size: 20px;
        letter-spacing: 0.02em;
      }

      .close {
        width: 22px;
        height: 22px;
        position: relative;
      }

      .close::before,
      .close::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 2px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
        transform-origin: center;
      }

      .close::before { transform: translate(-50%, -50%) rotate(45deg); }
      .close::after { transform: translate(-50%, -50%) rotate(-45deg); }

      .top-area {
        padding: 12px 16px 0 16px;
      }

      .site-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        padding: 10px 0 8px 0;
      }

      .site-row .left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .site-row .left::before {
        content: "◉";
        color: var(--green);
      }

      .site-row .link {
        color: var(--muted);
        text-decoration: none;
      }

      .header-card {
        background: rgba(18, 26, 34, 0.95);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 12px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .inline-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .inline-tag::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
      }

      .header-card .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(180deg, #f5d9c2, #f4a86b);
        color: #2c1f1b;
        display: grid;
        place-items: center;
        font-weight: 900;
      }

      .brand-name {
        font-size: 18px;
        font-weight: 800;
      }

      .pill-button {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .pill-button.primary {
        background: linear-gradient(180deg, rgba(255, 97, 79, 0.28), rgba(255, 97, 79, 0.14));
        border-color: rgba(255, 93, 77, 0.35);
        color: #fff;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }

      .index-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-weight: 700;
      }

      .index-main {
        font-size: 18px;
        color: var(--red);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .mini-grid .mini {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 8px;
        text-align: center;
      }

      .mini .label {
        color: var(--muted);
        font-size: 11px;
      }

      .mini .value {
        display: block;
        margin-top: 6px;
        font-weight: 800;
        font-size: 14px;
      }

      .section {
        padding: 18px 16px 0;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 800;
        margin: 0;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 8px;
      }

      .segmented .tab {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.025);
        color: var(--text);
        border-radius: 999px;
        height: 36px;
        font-size: 14px;
        font-weight: 700;
      }

      .segmented .tab.active {
        background: linear-gradient(180deg, rgba(255, 93, 77, 0.25), rgba(255, 93, 77, 0.12));
        border-color: rgba(255, 93, 77, 0.45);
        color: var(--text);
      }

      .segmented .tab.red {
        background: linear-gradient(180deg, rgba(255, 93, 77, 0.28), rgba(255, 93, 77, 0.14));
        border-color: rgba(255, 93, 77, 0.4);
      }

      .search-box {
        margin-top: 12px;
        width: 100%;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        background: rgba(255,255,255,0.03);
        padding: 12px 14px;
        color: var(--text);
        font-size: 14px;
      }

      .stock-list {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stock-row {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 10px;
        align-items: center;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 12px 10px;
      }

      .rank {
        color: var(--muted);
        font-size: 12px;
      }

      .stock-main {
        overflow: hidden;
      }

      .stock-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stock-name .sub {
        display: inline-block;
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }

      .stock-value {
        text-align: right;
      }

      .price {
        font-size: 16px;
        font-weight: 800;
      }

      .chg {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 700;
      }

      .chg.up { color: var(--red); }
      .chg.down { color: var(--green); }

      .bottom-nav {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        width: min(100%, 430px);
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        background: rgba(11, 17, 25, 0.9);
        border-top: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(8px);
      }

      .bottom-nav .nav-item {
        flex: 1;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        padding: 10px 4px 12px;
        border: 0;
        background: transparent;
      }

      .bottom-nav .nav-item.active {
        color: var(--text);
      }

      .bottom-nav .nav-item .icon {
        display: block;
        font-size: 20px;
        line-height: 1;
        margin-bottom: 2px;
      }

      @media (max-width: 430px) {
        .app { border: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="statusbar">
        <div class="left">
          <span>22:39</span>
          <span class="tiny">◔</span>
          <span class="tiny">◍</span>
          <span class="tiny">◉</span>
        </div>
        <div class="right">
          <span class="tiny">4G</span>
          <div class="signal-bars"><span></span><span></span><span></span><span></span></div>
          <span>67</span>
        </div>
      </div>

      <div class="topbar">
        <div class="menu"><span></span></div>
        <div class="title-box">
          <strong>股市大富翁</strong>
        </div>
        <div class="close"></div>
      </div>

      <div class="top-area">
        <div class="site-row">
          <div class="left">台股休市 ・ AI 仍可預約下一盤，開盤後自動撮合</div>
        </div>

        <div class="header-card">
          <div class="header-row">
            <div class="brand">
              <div class="brand-mark">許</div>
              <div>
                <div style="font-size:12px;color:var(--muted);">許家模擬股票</div>
                <div class="brand-name">股市大富翁</div>
              </div>
            </div>
            <button class="pill-button primary">操盤 #1 玩家</button>
          </div>

          <div class="meta-row">
            <span>已收盤</span>
            <span>22:39:57</span>
          </div>

          <div class="index-box">
            <div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">加權指數</div>
              <div class="index-main">47,180.75</div>
            </div>
            <div class="meta-row" style="display:block;text-align:right;">
              <div class="chg up">+1.93%</div>
            </div>
          </div>

          <div class="mini-grid">
            <div class="mini"><span class="label">可用資金</span><span class="value">$5,000,000</span></div>
            <div class="mini"><span class="label">上漲</span><span class="value red">62</span></div>
            <div class="mini"><span class="label">下跌</span><span class="value green">29</span></div>
            <div class="mini"><span class="label">AI 評估</span><span class="value gold">中性</span></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2 class="section-title">台股即時排行</h2>
        </div>

        <div class="segmented">
          <button class="tab active">全部</button>
          <button class="tab">上市</button>
          <button class="tab">上櫃</button>
        </div>

        <div class="segmented" style="margin-top:12px;">
          <button class="tab red">漲幅排行</button>
          <button class="tab">跌幅排行</button>
          <button class="tab">成交量</button>
        </div>

        <input class="search-box" value="搜尋代碼或名稱" aria-label="search" />

        <div id="stockList" class="stock-list"></div>
      </div>

      <nav class="bottom-nav">
        <button class="nav-item active"><span class="icon">◉</span>雷達</button>
        <button class="nav-item"><span class="icon">◫</span>下單</button>
        <button class="nav-item"><span class="icon">▣</span>庫存</button>
        <button class="nav-item"><span class="icon">◌</span>富翁榜</button>
        <button class="nav-item"><span class="icon">▤</span>排行</button>
      </nav>
    </div>

    <script>
      const stocks = [
        { rank: 1, code: '和益', name: '和益', price: 1709, change: -8.73, type: '上市', market: '台股' },
        { rank: 2, code: '亞通', name: '亞通', price: 6719, change: 8.56, type: '上櫃', market: '台股' },
        { rank: 3, code: '中信金', name: '中信金', price: 2891, change: -2.39, type: '上市', market: '台股' },
        { rank: 4, code: '第一金', name: '第一金', price: 2892, change: -2.33, type: '上市', market: '台股' },
        { rank: 5, code: '彰銀', name: '彰銀', price: 2801, change: -2.20, type: '上市', market: '台股' },
        { rank: 6, code: '臺企銀', name: '臺企銀', price: 2834, change: -2.13, type: '上市', market: '台股' },
        { rank: 7, code: '玉山金', name: '玉山金', price: 2884, change: -1.90, type: '上市', market: '台股' },
        { rank: 8, code: '國泰臺灣加權股', name: '國泰臺灣加權股', price: 10664R, change: -1.89, type: 'ETF', market: 'ETF' },
        { rank: 9, code: '元大台灣50反1', name: '元大台灣50反1', price: 100632R, change: -1.73, type: 'ETF', market: 'ETF' },
        { rank: 10, code: '陽明', name: '陽明', price: 2609, change: -1.61, type: '上市', market: '台股' },
        { rank: 11, code: '兆豐金', name: '兆豐金', price: 2886, change: -1.54, type: '上市', market: '台股' },
        { rank: 12, code: '永豐金', name: '永豐金', price: 2890, change: -1.52, type: '上市', market: '台股' },
        { rank: 13, code: '國泰金', name: '國泰金', price: 2882, change: -1.34, type: '上市', market: '台股' }
      ];

      const stockList = document.getElementById('stockList');

      function renderStockList(items) {
        stockList.innerHTML = items.map((s) => {
          const up = s.change >= 0;
          return `
            <div class="stock-row">
              <div class="rank">${s.rank}</div>
              <div class="stock-main">
                <div class="stock-name">
                  <span>${s.name}</span>
                  <span class="sub">${s.code}</span>
                </div>
                <div class="stock-name" style="margin-top:4px;color:var(--muted);font-size:11px;">
                  <span>${s.type}</span>
                  <span>・</span>
                  <span>${s.market}</span>
                </div>
              </div>
              <div class="stock-value">
                <div class="price">${Number(s.price).toLocaleString()}</div>
                <span class="chg ${up ? 'up' : 'down'}">${up ? '+' : ''}${s.change.toFixed(2)}%</span>
              </div>
            </div>
          `;
        }).join('');
      }

      renderStockList(stocks);

      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach((el) => el.classList.remove('active', 'red'));
          button.classList.add('active');
          if (button.textContent.includes('漲幅')) button.classList.add('red');
        });
      });
    </script>
  </body>
</html>
